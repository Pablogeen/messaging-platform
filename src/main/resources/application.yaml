spring:
  application:
    name: messaging-platform

  datasource:
    url: jdbc:mysql://localhost:3307/messaging_db
    username: messaging_user
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080